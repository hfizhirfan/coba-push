,\"f_57ec953da9e88bbb\":\"https:\/\/images.unsplash.com\/photo-1512496015851-a90fb38ba796?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_5865afda3987e845\":\"OMBRE POWDER\",\"f_6b8bb86c573141b3\":\"Full powder, look seperti memakai pensil alis\",\"f_2397d298cbe1a62b\":\"https:\/\/images.unsplash.com\/photo-1596704017254-9b121068fb31?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_f274e0cfd6bfc23c\":\"HAIRSTROKE\",\"f_fc6e5a8711907ef4\":\"Clean \\u0026amp; full hairstroke, serat bulu asli \\u0026amp; rapi\",\"f_cf62cf4ea1d3a1cd\":\"https:\/\/images.unsplash.com\/photo-1522337360788-8b13dee7a37e?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_ed48e621a3501101\":\"HAIRSTROKE MIX POWDER\",\"f_322ed23bd868089c\":\"Serat di bagian depan \\u0026amp; powder di belakang\",\"f_5aceff9c55653fd7\":\"https:\/\/images.unsplash.com\/photo-1527799820374-dcf8d9d4a388?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_aefb362bbbf8b5c5\":\"FLUFFY HAIRSTROKE\",\"f_c5d861566bd667e0\":\"Full hairstroke dengan penambahan baby hair padat\",\"f_c8d95ca215c8fc26\":\"https:\/\/images.unsplash.com\/photo-1588510977054-8e4b4d409743?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_0dd7be8298623d6c\":\"LIPS SULAM BIBIR\",\"f_0bf1a26a044c6c6f\":\"Natural rosy tone, merata dan segar merona\",\"f_0421b65dc7e982b4\":\"https:\/\/images.unsplash.com\/photo-1507003211169-0a1dd7228f2d?q=80\\u0026amp;w=800\\u0026amp;auto=format\\u0026amp;fit=crop\",\"f_637f49ff7aa2d1a4\":\"NATURAL ALIGNMENT\",\"f_e5e21334af0b9bd5\":\"Menyatu sempurna dengan tekstur alis asli\"},\"lock\":{\"move\":true,\"remove\":true},\"metadata\":{\"name\":\"Results Gallery\"}} \/-->\n\n<!-- wp:browsbyveron\/home-section {\"section\":\"terms\",\"values\":{\"f_94e639b642d19669\":\"POLICY \\u0026amp; GUIDELINES\",\"f_5efbcc71f2d75ebc\":\"TERM \\u0026amp; CONDITIONS\",\"f_549d684338987b92\":\"Harap membaca ketentuan berikut demi kenyamanan dan keamanan prosedur treatment Anda di Brows by Veron.\",\"f_ec6a502c37f3a18e\":\"1. Booking \\u0026amp; Down Payment (DP)\",\"f_a4640013d2615321\":\"Appointment hanya dapat dikonfirmasi setelah pembayaran DP diterima. \\u003cstrong\\u003eNo DP = No Booking Confirmation\\u003c\/strong\\u003e.\",\"f_a7fb7bb9265b671e\":\"2. Keterlambatan\",\"f_ccd6d8392083a182\":\"Batas toleransi keterlambatan maksimal \\u003cstrong\\u003e15 menit\\u003c\/strong\\u003e dari waktu yang telah dijadwalkan. Keterlambatan lebih dari 15 menit akan otomatis dijadwalkan ulang (\\u003cem\\u003ereschedule\\u003c\/em\\u003e).\",\"f_077fa3e3b22f76c2\":\"3. Kebijakan Reschedule\",\"f_58c58110975c2aa0\":\"Reschedule diperbolehkan maksimal \\u003cstrong\\u003e2 kali\\u003c\/strong\\u003e. Lebih dari 2 kali reschedule, DP dinyatakan hangus dan diperlukan DP baru untuk booking ulang.\",\"f_7d7a12928337cc6c\":\"4. Riwayat Treatment Sebelumnya\",\"f_0adad074e86a1e6c\":\"Client yang pernah melakukan sulam alis atau sulam bibir sebelumnya wajib mengirimkan foto kondisi terkini tanpa makeup untuk evaluasi terlebih dahulu.\",\"f_d63eaaac7789be67\":\"5. Kondisi Kehamilan \\u0026amp; Menyusui\",\"f_1e9fe056d441f5cf\":\"Client dalam kondisi hamil atau menyusui diwajibkan untuk konfirmasi dan konsultasi terlebih dahulu sebelum melakukan treatment.\",\"f_1ba4072185b85c37\":\"6. Riwayat Kesehatan\",\"f_1ac2f797771a254e\":\"Client dengan riwayat penyakit tertentu wajib konsultasi terlebih dahulu melalui admin demi keamanan dan kenyamanan treatment.\",\"f_02a7047f0000a511\":\"7. Pendampingan Selama Treatment\",\"f_bf34cea42f25fd61\":\"Demi kenyamanan dan kebersihan area kerja privat, client tidak diperkenankan membawa anak kecil maupun teman saat treatment berlangsung.\",\"f_c87d43a9e918fb5d\":\"8. Usia Minimum\",\"f_38279eb6f10f4d2e\":\"Minimal usia \\u003cstrong\\u003e18 tahun\\u003c\/strong\\u003e atau dengan persetujuan tertulis orang tua.\",\"f_3a62e541eaf86d1a\":\"9. Pre \\u0026amp; Aftercare Procedure\",\"f_6343350514ed8a00\":\"Client wajib mengikuti prosedur sebelum dan sesudah treatment sesuai arahan untuk memastikan hasil optimal dan proses healing yang baik.\",\"f_9e577dc72b80eebe\":\"10. Retouch Policy\",\"f_7a5aa8cd1f45dfaf\":\"Client akan mendapatkan \\u003cstrong\\u003eFREE retouch 1x dalam jangka waktu 1-2 bulan\\u003c\/strong\\u003e setelah treatment pertama. Retouch tahunan yang dilakukan sebelum 2 tahun berhak mendapatkan diskon 50% dari harga normal.\",\"f_ec010048d541ae83\":\"11. Refund Policy\",\"f_a82fcf04ec20e17d\":\"DP tidak dapat dikembalikan (\\u003cem\\u003enon-refundable\\u003c\/em\\u003e). Pembatalan H-1 atau di hari yang sama menyebabkan DP hangus.\",\"f_3c40350ff4e4e933\":\"12. Patch Test \\u0026amp; Allergic Reaction\",\"f_01e8abb928d9d649\":\"Disarankan melakukan patch test minimal 24 jam sebelum treatment (jika diperlukan). Reaksi alergi di luar kendali teknisi bukan tanggung jawab pihak BROWSBYVERON.\"},\"lock\":{\"move\":true,\"remove\":true},\"metadata\":{\"name\":\"Term \\u0026amp; Conditions\"}} \/-->\n\n<!-- wp:browsbyveron\/home-section {\"section\":\"contact\",\"values\":{\"f_8347e9dfc63bbf2b\":\"\u201cBeauty begins the moment you decide to be yourself\u201d\",\"f_db97fd3361fbf560\":\"Percayakan kesempurnaan alis dan bibir natural Anda kepada \\u003cstrong\\u003eWorldwide Championship PMU Artist\\u003c\/strong\\u003e. Slot jadwal terbatas demi menjaga kualitas pengerjaan 1-on-1.\",\"f_3210d184b140dd02\":\"Book Appointment via WhatsApp\",\"f_a26c925916b494ac\":\"View Full Price List\",\"f_71a34e53b79be526\":\"\u2728 Located in Surabaya City\",\"f_eb349df92253f2ab\":\"\ud83d\udccd Travels outside Surabaya available\",\"f_eba5c7af7c981435\":\"\ud83d\udee1\ufe0f 100% Sterile \\u0026amp; Disposable Needles\"},\"lock\":{\"move\":true,\"remove\":true},\"metadata\":{\"name\":\"Contact \/ Booking\"}} \/-->";
